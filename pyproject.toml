[project]
name = "ferreycorp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Irving Perez", email = "averageirving@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[project.scripts]
ferreycorp = "ferreycorp:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
